  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"94358f79-3e97-43c0-9409-f6fd3aa1ee78\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   FONTS — Kate Meyer\n   - Clash Display  : display / headings — SELF-HOSTED (variable woff2)\n   - Satoshi        : body / UI / labels — SELF-HOSTED (variable woff2 + italic)\n   The custom \"KATE MEYER\" wordmark ships as SVG (assets/logos/).\n   (Michroma was removed at the brand owner's request — June 2026.)\n   ============================================================ */\n\n/* ---- Clash Display (variable, wght 200–700) ---- */\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"7c0aafc0-583a-44bd-be20-bdf76cc154d4\") format('woff2');\n  font-weight: 200 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ---- Satoshi (variable, wght 300–900) ---- */\n@font-face {\n  font-family: 'Satoshi';\n  src: url(\"19adc97a-81fa-4505-a19e-bd66f22d2192\") format('woff2');\n  font-weight: 300 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Satoshi';\n  src: url(\"a84acf06-5801-47e0-a842-7ba77f5f9cc3\") format('woff2');\n  font-weight: 300 900;\n  font-style: italic;\n  font-display: swap;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   COLORS — Kate Meyer\n   The redesigned vibe: deep oxblood red ground, dusty blue accent,\n   warm creme \"ink\". High-contrast editorial palette.\n   ============================================================ */\n:root {\n  /* ---- Brand primitives ---- */\n  /* Oxblood red — the brand ground. 750608 is the canonical red. */\n  --oxblood-900: #3D0305;\n  --oxblood-800: #560507;\n  --oxblood-700: #750608;   /* CANONICAL brand red */\n  --oxblood-600: #8A1416;\n  --oxblood-500: #A02628;\n\n  /* Dusty blue — the single accent. 91b6cc is canonical. */\n  --blue-500: #6E9BB8;\n  --blue-400: #91B6CC;      /* CANONICAL accent */\n  --blue-300: #AECBDC;\n  --blue-200: #CBDEE9;\n\n  /* Creme — the warm \"white\". Replaces pure white everywhere. */\n  --creme-100: #F3EDDE;\n  --creme-200: #EDE6D5;     /* CANONICAL text creme */\n  --creme-300: #D8CDB8;\n\n  /* Ink — near-black, for buttons & deepest contrast. */\n  --ink-900: #0D0A0A;\n  --ink-800: #161212;\n\n  /* ---- Semantic aliases ---- */\n  --bg:               var(--oxblood-700);\n  --bg-deep:          var(--oxblood-900);\n  --surface:          var(--oxblood-800);   /* cards on the red ground */\n  --surface-raised:   var(--oxblood-600);   /* hover / raised cards */\n\n  --text:             var(--creme-200);     /* body & headings */\n  --text-bright:      var(--creme-100);     /* emphasis */\n  --text-dim:         color-mix(in srgb, var(--creme-200) 66%, transparent);\n  --text-muted:       color-mix(in srgb, var(--creme-200) 42%, transparent);\n\n  --accent:           var(--blue-400);      /* logo, links, pills */\n  --accent-strong:    var(--blue-300);\n  --on-accent:        var(--oxblood-700);   /* text on a blue fill */\n\n  --ink:              var(--ink-900);        /* button ground */\n  --on-ink:           var(--creme-200);      /* text on ink button */\n\n  --border:           color-mix(in srgb, var(--creme-200) 12%, transparent);\n  --border-strong:    color-mix(in srgb, var(--creme-200) 24%, transparent);\n  --border-accent:    color-mix(in srgb, var(--blue-400) 55%, transparent);\n\n  --selection-bg:     var(--blue-400);\n  --selection-text:   var(--oxblood-700);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPOGRAPHY — Kate Meyer\n   Two voices:\n   - DISPLAY (Clash Display): titles, headings, big numerals\n   - BODY  (Satoshi)        : prose, UI, buttons, AND labels/eyebrows\n   The brand wordmark is the SVG logo (assets/logos/), not a font.\n   ============================== n  --shadow-accent: 0 8px 30px color-mix(in srgb, var(--blue-400) 14%, transparent);\n\n  /* ---- Motion ---- */\n  --ease-out:     cubic-bezier(.16, 1, .3, 1);  /* @kind other */\n  --dur-fast:     .3s;  /* @kind other */\n  --dur:          .4s;  /* @kind other */\n  --dur-slow:     .5s;  /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"a3a6e6d2-682c-4b50-957d-ad278d1ff9a6\"><\u002Fscript>\n  <style>\n    html{scroll-behavior:smooth}\n    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)}\n    a{color:inherit;text-decoration:none}\n    ::selection{background:var(--selection-bg);color:var(--selection-text)}\n    @keyframes kmMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n    .km-marquee-track:hover{animation-play-state:paused}\n    .km-btn--primary:hover{opacity:.88;transform:translateY(-2px);box-shadow:var(--shadow-md)}\n    .km-btn--accent,.km-btn--ghost{border-radius:var(--radius-pill)!important}\n    .km-card{background:var(--bg)!important;border-color:var(--border-strong)!important}\n    .km-card--hover:hover{background:var(--bg)!important}\n    .km-proj__title{text-transform:uppercase}\n    .km-projcard:hover{border-color:var(--border-strong);transform:translateY(-4px);box-shadow:var(--shadow-md)}\n    .km-projcard:hover .km-projcard__title{color:var(--accent-strong)}\n    .km-resume-panel:hover{border-color:var(--border-accent);transform:translateY(-4px);box-shadow:var(--shadow-md)}\n    .km-resume-panel:hover .km-resume-cta{background:var(--accent);border-color:var(--accent);color:var(--ink-900)}\n    .km-resume-panel:hover .km-arrow{transform:translateX(4px)}\n    @media(max-width:900px){.km-resume-panel{grid-template-columns:1fr!important;gap:2rem!important;padding:2.2rem!important}}\n    @media(max-width:900px){.km-proj-grid{grid-template-columns:1fr!important}.km-projcard{grid-column:auto!important}}\n    .km-btn--accent:hover{background:var(--accent-strong);transform:translateY(-2px)}\n    .km-btn--ghost:hover{border-color:var(--text-dim);color:var(--text);transform:translateY(-2px)}\n    .km-navlink:hover{color:var(--accent-strong)}\n    .km-tag:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-2px)}\n    .km-card--hover:hover{border-color:var(--border-strong);transform:translateY(-4px);box-shadow:var(--shadow-md)}\n    .km-proj:hover{transform:translateX(6px)}\n    .km-proj:hover .km-proj__num{color:var(--accent)}\n    .km-proj:hover .km-proj__title{color:var(--accent-strong)}\n    .km-contact-email:hover{color:var(--accent);border-color:var(--border-accent)}\n    .km-contact-email:hover .km-arrow{transform:translateX(5px)}\n    .km-social:hover{color:var(--accent)}\n    .km-back-top:hover{color:var(--accent)}\n    @media(max-width:900px){\n      .km-about-grid{grid-template-columns:1fr!important;gap:2.5rem!important}\n      .km-design-grid{grid-template-columns:1fr!important;gap:2.5rem!important}\n      .km-resume-grid{grid-template-columns:1fr!important}\n      .km-proj{grid-template-columns:1fr!important;gap:1.2rem!important}\n      .km-sec{padding:5rem var(--gutter-mobile)!important}\n      .km-hero-pad{padding-left:var(--gutter-mobile)!important;padding-right:var(--gutter-mobile)!important}\n    }\n    @media(max-width:600px){.km-about-cards{grid-template-columns:1fr!important}}\n    /* --- motion layer --- */\n    #km-intro{position:fixed;inset:0;z-index:1000;background:var(--blue-400);display:flex;align-items:center;justify-content:center;transform:translateY(0);transition:transform .9s cubic-bezier(.76,0,.24,1)}\n    #km-intro.is-done{transform:translateY(-100%)}\n    #km-intro-logo{opacity:0;transform:translateY(34px);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}\n    #km-intro.is-ready #km-intro-logo{opacity:1;transform:none}\n    .km-reveal{opacity:0;transform:translateY(46px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out)}\n    .km-reveal.is-in{opacity:1;transform:none}\n    #km-cursor-dot,#km-cursor-ring{display:none;position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:2000}\n    #km-cursor-dot{width:9px;height:9px;background:var(--blue-400)}\n    #km-cursor-ring{width:36px;height:36px;border:1px solid var(--blue-400);transition:width .25s var(--ease-out),height .25s var(--ease-out),border-color .25s var(--ease-out),opacity .25s var(--ease-out)}\n    #km-cursor-ring.is-hover{width:64px;height:64px;border-color:var(--creme-200)}\n    @media(hover:hover) and (pointer:fine){\n      body,a,button,.km-btn,.km-card{cursor:none!important}\n    }\n    .km-marquee-track span{transition:transform .45s var(--ease-out)}\n    .km-marquee-track span:hover{transform:skewX(-8deg) scale(1.06)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"km-intro\">\n  <div id=\"km-intro-logo\">\n    <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Logo\" hint-size=\"auto,60px\" height=\"60\" color=\"var(--oxblood-700)\"><\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"km-cursor-dot\"><\u002Fdiv>\n<div id=\"km-cursor-ring\"><\u002Fdiv>\n\n<x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.NavBar\" hint-size=\"100%,80px\" style=\"{{ navStyle }}\"><\u002Fx-import>\n\n<div id=\"km-smooth\" style=\"overflow-x:hidden\">\n\n<section id=\"top\" style=\"position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 9rem 0 0; background-color: #790F11\">\n  <div class=\"km-hero-pad\" style=\"padding:0 var(--gutter);margin-bottom:3rem\">\n    <div style=\"font-family:var(--font-wide);font-size:.68rem;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--blue-300);margin-bottom:1.4rem\">SEEKING MARKETING ROLES<\u002Fdiv><p style=\"font-size: 0.99rem; font-weight: 200; color: var(--text-dim); max-width: 520px; line-height: 1.35; margin: 0; font-style: italic; text-align: justify; width: 412px; height: 44px\">Hello! I'm Kate Meyer, a strategist, analyst, &amp; designer building at the intersection of data and creative problem-solving.<\u002Fp>\n    \n  <\u002Fdiv>\n\n  <div style=\"overflow:hidden;padding:4rem 0 3rem\">\n    <div class=\"km-marquee-track\" style=\"display:flex;width:max-content;animation:kmMarquee 38s linear infinite\">\n      <sc-for list=\"{{ marqueeItems }}\" as=\"m\" hint-placeholder-count=\"8\">\n        <span style=\"display:flex;align-items:center;gap:4.5rem;padding-right:4.5rem\" aria-hidden=\"true\">\n          <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Logo\" hint-size=\"auto,80px\" variant=\"alt\" height=\"80\" color=\"var(--text)\"><\u002Fx-import>\n        <\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"km-hero-pad\" style=\"padding:0 var(--gutter) 3.5rem;display:flex;justify-content:flex-end\">\n    <div style=\"display:flex;gap:1rem\">\n      <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Button\" hint-size=\"auto,48px\" variant=\"accent\" as=\"a\" href=\"#projects\" icon=\"↓\" style=\"position: relative\">View my work<div style=\"box-sizing: border-box; display: flex; flex-direction: column; width: 120px; height: 120px; background-color: var(--blue-400); border-radius: 24px; position: absolute; left: 578px; top: 182px; width: 120px; height: 120px\"><\u002Fdiv><\u002Fx-import>\n      <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Button\" hint-size=\"auto,48px\" variant=\"ghost\" as=\"a\" href=\"#contact\">Get in touch<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section class=\"km-sec\" id=\"about\" style=\"padding: 7rem var(--gutter); border-top: 1px solid var(--border); background-color: #790F11\">\n  <div style=\"max-width:var(--maxw);margin:0 auto\">\n    \n\n    <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.SectionHeader\" hint-size=\"100%,120px\" label=\"01. About\" title=\"About Me\" mark=\"{{ markAbout }}\" desc=\"Management, marketing, analytics, and design, I like working where these things overlap.\"><\u002Fx-import><div class=\"km-about-grid\" style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:5rem;align-items:start\">\n      <div>\n        <p style=\"font-size:1rem;line-height:var(--lh-relaxed);color:var(--text-dim);margin:0 0 1.4rem\">A recent University of Kentucky graduate (May 2026) with a dual major in Management &amp; Marketing, a minor in Business Analytics, and a freelance graphic design practice on the side.<\u002Fp>\n        <p style=\"font-size:1rem;line-height:var(--lh-relaxed);color:var(--text-dim);margin:0 0 1.4rem\">The best marketing happens when analytical rigor meets creative intuition. Over the past four years, I've built a foundation in predictive modeling, data visualization, strategic case analysis, and visual design. I'm drawn to work that sits at the intersection of all of them.<\u002Fp>\n        <p style=\"font-size:1rem;line-height:var(--lh-relaxed);color:var(--text-dim);margin:0\">I'm now pursuing roles in marketing, account services, and agency work, as well as in-house marketing teams, where I can apply both the quantitative and creative sides of my background from day one.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"km-about-cards\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden\">\n          <sc-for list=\"{{ aboutCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"padding:1.7rem;background:var(--bg)\">\n              <div style=\"font-family:var(--font-wide);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.6rem\">{{ c.label }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-display);font-size:1.05rem;font-weight:var(--fw-medium);color:var(--text);line-height:1.3;text-transform:uppercase\">{{ c.value }}<\u002Fdiv>\n              <div style=\"font-size:.78rem;color:var(--text-muted);margin-top:.25rem\">{{ c.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.45rem;margin-top:2rem\">\n          <sc-for list=\"{{ skills }}\" as=\"s\" hint-placeholder-count=\"11\">\n            <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">{{ s }}<\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection><section class=\"km-sec\" id=\"projects\" style=\"padding: 7rem var(--gutter); border-top: 1px solid var(--border); background-color: var(--bg)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto\">\n    <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.SectionHeader\" hint-size=\"100%,120px\" label=\"02. Selected Work\" title=\"Projects &amp; Case Studies\" mark=\"{{ markProjects }}\" desc=\"Analytics projects and strategic case analyses, each chosen to show range across data, strategy, and marketing.\"><\u002Fx-import>\n\n    <div class=\"km-proj-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:1.5rem\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n        <article class=\"km-projcard\" style=\"{{ p.cardStyle }}\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;margin-bottom:2rem\">\n            <div role=\"img\" aria-label=\"{{ p.number }}\" style=\"{{ p.numStyle }}\"><\u002Fdiv>\n            <div style=\"font-family:var(--font-wide);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-300);white-space:nowrap;padding-top:.4rem\">{{ p.type }}<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 class=\"km-projcard__title\" style=\"font-family:var(--font-display);font-size:1.45rem;font-weight:var(--fw-medium);line-height:1.15;text-transform:uppercase;color:var(--text);margin:0 0 1rem;max-width:26ch;transition:color var(--dur) var(--ease-out)\">{{ p.title }}<\u002Fh3>\n          <p style=\"font-size:.9rem;line-height:1.75;color:var(--text-dim);margin:0 0 1.8rem\">{{ p.desc }}<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:.45rem;margin-top:auto\">\n            <sc-for list=\"{{ p.tags }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">{{ t }}<\u002Fx-import>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"km-sec\" id=\"design\" style=\"padding:7rem var(--gutter);border-top:1px solid var(--border)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto\">\n    <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.SectionHeader\" hint-size=\"100%,120px\" label=\"03. Freelance\" title=\"Graphic Design\" mark=\"{{ markDesign }}\"><\u002Fx-import>\n\n    <div class=\"km-design-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start\">\n      <div>\n        <p style=\"font-size:1rem;line-height:var(--lh-relaxed);color:var(--text-dim);margin:0 0 1.4rem\">Beyond analytics and strategy, I've built a freelance design practice creating brand identities, social media assets, and visual systems for small businesses and organizations.<\u002Fp>\n        <p style=\"font-size:1rem;line-height:var(--lh-relaxed);color:var(--text-dim);margin:0\">Design isn't separate from my analytical work — it's what makes it communicate. Every presentation, visualization, and portfolio piece I build reflects a designer's eye for clarity and composition.<\u002Fp>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Card\" hint-size=\"100%,220px\" padding=\"2.5rem\">\n        <p style=\"font-family:var(--font-display);font-size:1.1rem;color:var(--text-dim);line-height:1.6;margin:0 0 1.6rem\"><strong style=\"color:var(--text);font-weight:var(--fw-medium)\">Portfolio samples coming soon.<\u002Fstrong> In the meantime, I'd love to share examples of my design work directly, reach out and I'll send over selected pieces from recent client projects.<\u002Fp>\n        <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Button\" hint-size=\"auto,48px\" variant=\"accent\" as=\"a\" href=\"#contact\" icon=\"→\" style=\"{{ pillRadius }}\">Get in touch<\u002Fx-import>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"km-sec\" id=\"resumes\" style=\"padding:7rem var(--gutter);border-top:1px solid var(--border)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto\">\n    <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.SectionHeader\" hint-size=\"100%,120px\" label=\"04. Resume\" title=\"Resume\" mark=\"{{ markResume }}\"><\u002Fx-import>\n\n    <a class=\"km-resume-panel\" href=\"https://k8meyer.github.io/portfolio/v3_KateMeyer_Resume_MarketingAnalytics.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:grid;grid-template-columns:1fr auto;gap:3rem;align-items:center;border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:3rem 3.2rem;transition:transform var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out)\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem\">\n          <div style=\"width:36px;height:36px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--text-dim);border-radius:8px\">◇<\u002Fdiv>\n          <h3 style=\"font-family:var(--font-display);font-size:1.6rem;font-weight:var(--fw-medium);margin:0;color:var(--text);text-transform:uppercase\">Marketing Analytics<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"font-size:.9rem;color:var(--text-dim);line-height:1.75;margin:0;max-width:56ch\">Frames experience around consumer insights, campaign performance, and data-driven marketing. Built for marketing analyst, CRM, and brand strategy roles.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.6rem\">\n          <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">Consumer Insights<\u002Fx-import>\n          <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">Campaign Performance<\u002Fx-import>\n          <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">CRM<\u002Fx-import>\n          <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Tag\" hint-size=\"auto,32px\">Brand Strategy<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"km-resume-cta\" style=\"display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-wide);font-size:.72rem;font-weight:var(--fw-medium);letter-spacing:.12em;text-transform:uppercase;color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:1rem 1.8rem;white-space:nowrap;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)\">Download PDF <span class=\"km-arrow\" style=\"transition:transform var(--dur) var(--ease-out)\">→<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"text-align:center;padding:9rem var(--gutter);border-top:1px solid var(--border)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;align-items:center\">\n    <div style=\"font-family:var(--font-wide);font-size:.64rem;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);margin-bottom:1.4rem\">05. Contact<\u002Fdiv> mailLabel }}\n    <\u002Fa>\n    <div style=\"display:flex;gap:2.5rem;margin-top:2.8rem\">\n      <a href=\"https://www.linkedin.com/in/kate-meyer-606459322/\" target=\"_blank\" rel=\"noopener\" class=\"km-social\" style=\"font-family:var(--font-wide);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);transition:color var(--dur-fast) var(--ease-out)\">LinkedIn<\u002Fa>\n      <a href=\"https://www.behance.net/k8meyer\" target=\"_blank\" rel=\"noopener\" class=\"km-social\" style=\"font-family:var(--font-wide);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);transition:color var(--dur-fast) var(--ease-out)\">Behance<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:2rem var(--gutter);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:1rem\">\n  <x-import component-from-global-scope=\"KateMeyerDesignSystem_b6f865.Logo\" hint-size=\"auto,16px\" height=\"16\" color=\"var(--text-muted)\"><\u002Fx-import>\n  <p style=\"font-size:.72rem;color:var(--text-muted);letter-spacing:.03em;margin:0\">© 2026 Kate Meyer, Lexington, KY<\u002Fp>\n  <a href=\"#top\" class=\"km-back-top\" style=\"font-family:var(--font-wide);font-size:.6rem;color:var(--text-muted);letter-spacing:.14em;text-transform:uppercase;transition:color var(--dur-fast) var(--ease-out)\">Back to top ↑<\u002Fa>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;viewWorkButtonColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2E5EAA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2E5EAA&quot;,&quot;#3B6FCB&quot;,&quot;#1E3A5F&quot;,&quot;#4A7FD4&quot;]}}\">\nclass Component extends DCLogic {\n  state = { copied: false };\n\n  componentDidMount() {\n    if (window.__kmMotionInit) return;\n    window.__kmMotionInit = true;\n    const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;\n\n    // --- Intro curtain ---\n    const intro = document.getElementById('km-intro');\n    if (intro) {\n      document.documentElement.style.overflow = 'hidden';\n      setTimeout(() => intro.classList.add('is-ready'), 120);\n      setTimeout(() => {\n        intro.classList.add('is-done');\n        document.documentElement.style.overflow = '';\n      }, 1500);\n      setTimeout(() => { intro.style.display = 'none'; }, 2600);\n    }\n\n    // --- Scroll reveals ---\n    const targets = document.querySelectorAll(\n      '#top .km-hero-pad > *, .km-sec > div > *, #contact > div > *, footer > *'\n    );\n    targets.forEach((el) => el.classList.add('km-reveal'));\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) {\n          const el = en.target;\n          const sibs = Array.from(el.parentElement.children).filter((c) => c.classList.contains('km-reveal'));\n          el.style.transitionDelay = (sibs.indexOf(el) * 90) + 'ms';\n          el.classList.add('is-in');\n          io.unobserve(el);\n        }\n      });\n    }, { threshold: 0.12 });\n    targets.forEach((el) => io.observe(el));\n\n    if (!fine) return;\n\n    // --- Custom cursor ---\n    const dot = document.getElementById('km-cursor-dot');\n    const ring = document.getElementById('km-cursor-ring');\n    if (dot && ring) {\n      dot.style.display = 'block'; ring.style.display = 'block';\n      let mx = -100, my = -100, rx = -100, ry = -100;\n      window.addEventListener('mousemove', (e) => {\n        mx = e.clientX; my = e.clientY;\n        dot.style.transform = 'translate(' + mx + 'px,' + my + 'px) translate(-50%,-50%)';\n      });\n      const cl = () => {\n        rx += (mx - rx) * 0.16; ry += (my - ry) * 0.16;\n        ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';\n        requestAnimationFrame(cl);\n      };\n      requestAnimationFrame(cl);\n      document.addEventListener('mouseover', (e) => {\n        ring.classList.toggle('is-hover', !!e.target.closest('a,button,.km-btn,.km-card,.km-tag'));\n      });\n    }\n\n    // --- Magnetic buttons ---\n    document.querySelectorAll('.km-btn').forEach((btn) => {\n      btn.addEventListener('mousemove', (e) => {\n        const r = btn.getBoundingClientRect();\n        const dx = (e.clientX - r.left - r.width / 2) / r.width;\n        const dy = (e.clientY - r.top - r.height / 2) / r.height;\n        btn.style.transform = 'translate(' + (dx * 8) + 'px,' + (dy * 6 - 2) + 'px)';\n      });\n      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });\n    });\n\n    // --- Inertia smooth scroll + marquee skew ---\n    if (window.innerWidth > 900) {\n      const wrap = document.getElementById('km-smooth');\n      if (wrap) {\n        document.documentElement.style.scrollBehavior = 'auto';\n        wrap.style.position = 'fixed';\n        wrap.style.top = '0'; wrap.style.left = '0'; wrap.style.width = '100%';\n        wrap.style.willChange = 'transform';\n        const setH = () => { document.body.style.height = wrap.scrollHeight + 'px'; };\n        setH();\n        new ResizeObserver(setH).observe(wrap);\n        const mq = document.querySelector('.km-marquee-track');\n        const mqWrap = mq ? mq.parentElement : null;\n        let cur = window.scrollY;\n        const loop = () => {\n          const t = window.scrollY;\n          cur += (t - cur) * 0.09;\n          if (Math.abs(t - cur) < 0.05) cur = t;\n          wrap.style.transform = 'translate3d(0,' + (-cur) + 'px,0)';\n          if (mqWrap) {\n            const v = Math.max(-10, Math.min(10, (t - cur) * 0.04));\n            mqWrap.style.transform = 'skewX(' + v + 'deg)';\n          }\n          requestAnimationFrame(loop);\n        };\n        requestAnimationFrame(loop);\n      }\n    }\n  }\n\n  decorateProjects(list) {\n    return list.map((p, i) => ({\n      ...p,\n      cardStyle: {\
